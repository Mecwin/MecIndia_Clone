<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MECWIN Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <img src="mecwinlogo.jpeg" class="logo" />

    <div class="badge">⏱ 5 Questions • 2 Minutes</div>

    <h1>Join Quiz</h1>
    <p class="subtitle">Enter your details to get started</p>

    <form id="startForm">
      <label>Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required />

      <label>Phone </label>
      <input type="tel" id="email" placeholder="Enter your 10 digit phone number" required />

      <button type="submit">Start Quiz</button>
    </form>

    <div class="info">
      ℹ Your phone number will be used to track participation.
      You can only take the quiz once.
    </div>
  </div>

  <script type="module" src="start.js"></script>
</body>
</html>
