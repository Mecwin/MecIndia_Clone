<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="result.css">
</head>
<body>
  <div class="result-container">
    <div class="card">

      <h1>🎯 Quiz Result</h1>
      <p id="userName"></p>

      <div class="progress-circle">
        <svg width="180" height="180">
          <circle cx="90" cy="90" r="70"></circle>
          <circle cx="90" cy="90" r="70" id="progress"></circle>
        </svg>
        <div class="score-text">
          <span id="scoreNumber">0</span>/5
        </div>
      </div>

      <h2 id="statusText"></h2>

      <button onclick="location.href='index.html'">🔄 Try Again</button>
    </div>
  </div>

  <script type="module" src="result.js"></script>
</body>
</html>
